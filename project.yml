name: DeadPixelTest
options:
  bundleIdPrefix: com.test
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
targets:
  DeadPixelTest:
    type: application
    platform: iOS
    sources:
      - DeadPixelTest
    resources:
      - DeadPixelTest/Assets.xcassets
    info:
      path: DeadPixelTest/Info.plist
      properties:
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        CFBundleDisplayName: "坏点检测"
    settings:
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
