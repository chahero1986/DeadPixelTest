name: Build Unsigned IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build xcode archive
        run: |
          xcodebuild archive \
            -project DeadPixelTest.xcodeproj \
            -scheme DeadPixelTest \
            -destination generic/platform=iOS \
            -archivePath build/DeadPixelTest.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # ========== 重点改动：不再调用xcodebuild exportArchive，手动打包IPA ==========
      - name: Make unsigned IPA manually
        run: |
          mkdir -p build/export/Payload
          cp -r build/DeadPixelTest.xcarchive/Products/Applications/DeadPixelTest.app build/export/Payload/
          cd build/export
          zip -q -r DeadPixelTest.ipa Payload
          
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadPixelTest-unsigned
          path: build/export/DeadPixelTest.ipa
